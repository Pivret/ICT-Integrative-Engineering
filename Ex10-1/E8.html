<!DOCTYPE html>
<head>
    <title>문서의 동적 구성</title>
    <script>
        function cDiv(){
            var body = document.getElementById("body1");
            var nDiv = document.createElement("div");
            nDiv.innerHTML = "20233076 임해주";
            nDiv.setAttribute("id","myDiv");
            nDiv.style.backgroundColor = "yellow";
            nDiv.onclick = function(){
                var p = this.parentElement;
                p.removeChild(this);
            }
            body.appendChild(nDiv);
        }
    </script>
</head>
<body id="body1">
    <h3>Example</h3>
    <hr>
    <p>
        DOM을 이용하여 동적으로 객체를 삽입하기<br>
    <a href="javascript:cDiv()">학번과 이름은?</a>
    </p>
</body>
</html>
